[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canlib"
# Single source of truth for the version. Bump this for a release.
version = "1.34.0"
description = "Python wrapper for Kvaser CANlib"
readme = "README.rst"
requires-python = ">=3.9"

authors = [
    { name = "Kvaser AB", email = "support@kvaser.com" }
]

license = "MIT"

dependencies = [
    "pydantic>=1.8.1",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Kvaser/pycanlib"

[dependency-groups]

test = [
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pandas",
]

docs = [
    "sphinx==5.0.2",
    "sphinx-rtd-theme==1.1.1",
    "docutils==0.17.1",
    "rst2html5==2.0",
]

release = [
    "build",
    "twine",
]

# Tooling not needed for tests/docs/release — e.g. check_wrapper.py, which reads
# DLL export tables with pefile to verify every native function is wrapped.
dev = [
    "pefile",
]

[tool.hatch.build.targets.wheel]
packages = ["canlib"]

# Files are excluded by default. pyproject.toml, README.rst and LICENSE are
# always included automatically.
[tool.hatch.build.targets.sdist]
include = [
    "/canlib",
    "/tests",
    "/docs",
    "/examples",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-Wd --randomly-dont-reorganize --strict-markers"
markers = [
    "slow: mark test as slow, takes more than 1s.",
]